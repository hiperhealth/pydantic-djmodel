name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: osl-incubator/gh-check-pr-is-updated@1.0.0
        with:
          remote_branch: origin/main
          pr_sha: ${{ github.event.pull_request.head.sha }}

  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -el {0}
    env:
      POETRY_VIRTUALENVS_CREATE: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: pydantic-djmodel
          conda-solver: libmamba
      - name: Install development dependencies
        run: |
          poetry check --lock
          poetry install --no-interaction
      - name: Lint
        run: poetry run pre-commit run --all-files
      - name: Build documentation
        run: poetry run mkdocs build --strict
      - name: Build and check distributions
        run: |
          poetry build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  tests:
    needs: linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      matrix:
        include:
          - python: '3.10'
            django: 'Django>=5.2,<5.3'
            pydantic: 'pydantic==2.10.6'
          - python: '3.12'
            django: 'Django>=6,<7'
            pydantic: 'pydantic>=2.10.6,<3'
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          channels: conda-forge,nodefaults
          activate-environment: pydantic-djmodel-test
          conda-solver: libmamba
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Test the installed wheel
        env:
          DJANGO_REQUIREMENT: ${{ matrix.django }}
          PYDANTIC_REQUIREMENT: ${{ matrix.pydantic }}
        run: |
          python -m pip install dist/*.whl pytest pytest-django "$DJANGO_REQUIREMENT" "$PYDANTIC_REQUIREMENT"
          python -m pytest
