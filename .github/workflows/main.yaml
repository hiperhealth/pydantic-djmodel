name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: osl-incubator/gh-check-pr-is-updated@1.0.0
        with:
          remote_branch: origin/main
          pr_sha: ${{ github.event.pull_request.head.sha }}

  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m pip install 'poetry==2.1.4'
          poetry check --lock
          poetry install --no-interaction
      - name: Lint
        run: poetry run pre-commit run --all-files
      - name: Build documentation
        run: poetry run mkdocs build --strict

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: '3.10'
            django: 'Django>=5.2,<5.3'
            pydantic: 'pydantic==2.10.6'
          - python: '3.12'
            django: 'Django>=6.0,<6.1'
            pydantic: 'pydantic>=2.10.6,<3'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the installed wheel
        env:
          DJANGO_REQUIREMENT: ${{ matrix.django }}
          PYDANTIC_REQUIREMENT: ${{ matrix.pydantic }}
        run: |
          python -m pip install dist/*.whl pytest pytest-django "$DJANGO_REQUIREMENT" "$PYDANTIC_REQUIREMENT"
          python -m pytest
