name: Publish to PyPI

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'hiperhealth/pydantic-djmodel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          environment-file: conda/release.yaml
          channels: conda-forge,nodefaults
          activate-environment: pydantic-djmodel-release
          conda-solver: libmamba
      - name: Check the release tag
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected = f"v{project['version']}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Expected tag {expected}, got {actual}")
          PY
      - name: Build and check distributions
        run: |
          poetry build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pydantic-djmodel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
